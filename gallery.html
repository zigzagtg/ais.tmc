<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery — The Media Club</title>
    <meta name="description" content="Explore our creative media gallery showcasing film, photography, and more.">
    <meta name="keywords" content="media, gallery, film, photography, creative">
    <meta name="author" content="Media Club">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="gallery.css">
</head>

<body>
  <!-- Header (Navbar) -->
<header class="site-header">
  <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="Media Club home">
          <img src="./images/logo.png" alt="Media Club logo" class="brand-logo" width="40" height="40">
          <span class="brand-text">T.M.C</span>
      </a>

      <button class="nav-toggle" aria-expanded="false" aria-controls="site-navigation">
          <span class="sr-only">Menu</span>
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" fill="none"></path>
          </svg>
      </button>

      <nav id="site-navigation" class="site-nav" role="navigation">
          <ul class="nav-list">
              <li><a href="index.html">Home</a></li>
              <li><a href="about.html">About Us</a></li>
              <li><a href="gallery.html">Gallery</a></li>
              <li><a href="#">Events</a></li>
              <li><a href="#">Contact</a></li>
          </ul>
      </nav>
  </div>
</header>

<!-- Gallery Header Section -->
<section class="gallery-header text-center">
  <h2>From Our Gallery</h2>
  <p>Explore our collection of creative media, showcasing our work in photography, film, and more.</p>
</section>

<div id="gallery" class="gallery-container">

  <!-- Image with lightbox -->
  <a href="#img1" class="media-item">
    <img src="media/photo1.jpg" alt="Beautiful landscape">
  </a>
  <div class="lightbox" id="img1">
    <a href="#" class="close"></a>
    <img src="media/photo1.jpg" alt="Beautiful landscape">
  </div>

  <!-- Another Image -->
  <a href="#img2" class="media-item">
    <img src="media/photo2.jpg" alt="City skyline">
  </a>
  <div class="lightbox" id="img2">
    <a href="#" class="close"></a>
    <img src="media/photo2.jpg" alt="City skyline">
  </div>

  <!-- Video with lightbox -->
  <a href="#vid1" class="media-item">
    <video preload="metadata">
      <source src="media/video1.mp4" type="video/mp4">
    </video>
  </a>
  <div class="lightbox" id="vid1">
    <a href="#" class="close"></a>
    <video controls autoplay>
      <source src="media/video1.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Another Video -->
  <a href="#vid2" class="media-item">
    <video preload="metadata">
      <source src="media/video2.mp4" type="video/mp4">
    </video>
  </a>
  <div class="lightbox" id="vid2">
    <a href="#" class="close"></a>
    <video controls autoplay>
      <source src="media/video2.mp4" type="video/mp4">
    </video>
  </div>

</div>

 <!-- Footer -->
 <footer class="site-footer">
  <div class="container">
      <p>&copy; 2026 The Media Club. All rights reserved.</p>

  </div>
</footer>

</body>

<script src="/js/gallery.js"></script>

</html>
